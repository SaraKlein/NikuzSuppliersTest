<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f4">
  <title>כניסת ספקים</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
      color: #20332d;
      background: #f5f7f4;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at 10% 10%, rgba(210, 229, 215, 0.55), transparent 38%),
        #f5f7f4;
    }

    .login-card {
      width: min(100%, 460px);
      padding: 44px;
      border: 1px solid #e6ebe5;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(28, 54, 42, 0.09);
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin-bottom: 26px;
      border-radius: 14px;
      background: #e9f2eb;
      color: #287449;
      font-size: 24px;
      font-weight: 700;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #568169;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 34px);
      letter-spacing: -0.7px;
    }

    .intro {
      margin: 12px 0 30px;
      color: #6c7972;
      font-size: 16px;
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 19px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #dce3dd;
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: #20332d;
      font: inherit;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    input::placeholder {
      color: #a2aca6;
    }

    input:focus {
      border-color: #43875f;
      box-shadow: 0 0 0 3px rgba(67, 135, 95, 0.14);
    }

    .submit-button {
      min-height: 52px;
      margin-top: 5px;
      border: 0;
      border-radius: 9px;
      background: #287449;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    .submit-button:hover {
      background: #205f3b;
    }

    .submit-button:active {
      transform: translateY(1px);
    }

    .submit-button:focus-visible {
      outline: 3px solid #a8d2b5;
      outline-offset: 3px;
    }

    .status {
      min-height: 0;
      margin: 0;
      color: #8a4b16;
      font-size: 14px;
      line-height: 1.5;
    }

    .status:not(:empty) {
      padding: 11px 12px;
      border-radius: 8px;
      background: #fff5e9;
    }

    @media (max-width: 520px) {
      .login-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">ס</div>
    <p class="eyebrow">פורטל ספקים</p>
    <h1>כניסת ספקים</h1>
    <p class="intro">יש למלא את פרטי הספק כדי להמשיך.</p>

    <form id="supplier-login" novalidate>
      <div class="field">
        <label for="supplier-number">מספר ספק</label>
        <input
          id="supplier-number"
          name="supplierNumber"
          type="text"
          placeholder="לדוגמה: 123456"
          autocomplete="off"
          required
        >
      </div>

      <div class="field">
        <label for="supplier-name">שם ספק</label>
        <input
          id="supplier-name"
          name="supplierName"
          type="text"
          placeholder="שם העסק או הספק"
          autocomplete="organization"
          required
        >
      </div>

      <div class="field">
        <label for="supplier-email">דואר אלקטרוני</label>
        <input
          id="supplier-email"
          name="supplierEmail"
          type="email"
          placeholder="name@example.com"
          autocomplete="email"
          dir="ltr"
          required
        >
      </div>

      <button class="submit-button" type="submit">כניסה</button>
      <p class="status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('supplier-login');
    const status = document.getElementById('form-status');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      status.textContent = '';

      if (!form.reportValidity()) {
        return;
      }

      status.textContent = 'הטופס מוכן, אך הכניסה עדיין אינה מחוברת למערכת.';
    });
  </script>
</body>
</html>
